<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EngliForce Pickle: Personal Data Detective</title>
    <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Lexend:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --hero-purple-main: #6a1b9a;
            --hero-purple-dark: #4a148c;
            --hero-yellow: #ffb703;
            --hero-cyan: #b39ddb;
            --dark-bg: #0b101a;
            --hero-orange: #ff5722;
        }

        body {
            font-family: 'Lexend', sans-serif;
            background: radial-gradient(circle at center, #1a102a 0%, #05051a 100%);
            color: white;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header {
            width: 100%;
            background: var(--hero-orange);
            padding: 2rem 0;
            text-align: center;
            clip-path: polygon(0 0, 100% 0, 100% 85%, 0 100%);
            border-bottom: 5px solid var(--hero-yellow);
            margin-bottom: 20px;
        }

        h1 { 
            font-family: 'Bangers', cursive; 
            font-size: 3rem; 
            margin: 0; 
            text-shadow: 3px 3px 0px #bf360c; 
            color: white; 
        }

        .container { 
            max-width: 700px; 
            width: 90%; 
            margin: 20px auto; 
        }

        .section {
            background: rgba(26, 16, 42, 0.8);
            border-radius: 20px;
            padding: 2rem;
            border: 2px solid var(--hero-cyan);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            margin-bottom: 20px;
        }

        .instructions { 
            font-size: 0.9rem; 
            color: var(--hero-cyan); 
            line-height: 1.5; 
            margin-bottom: 20px; 
            text-align: left; 
        }

        label { 
            display: block; 
            margin-top: 1rem; 
            font-family: 'Bangers'; 
            color: var(--hero-yellow); 
            font-size: 1.2rem; 
        }

        input, select {
            width: 100%;
            padding: 12px;
            margin-top: 5px;
            border-radius: 10px;
            border: 2px solid var(--hero-purple-main);
            background: #0b101a;
            color: white;
            box-sizing: border-box;
            font-family: 'Lexend', sans-serif;
        }

        .btn {
            background: var(--hero-orange);
            color: white;
            border: none;
            padding: 15px 25px;
            border-radius: 50px;
            font-family: 'Bangers';
            font-size: 1.4rem;
            cursor: pointer;
            border-bottom: 5px solid #bf360c;
            transition: 0.2s;
            margin: 10px 5px 0 0;
            width: 100%;
        }

        .btn:hover { 
            transform: translateY(-3px); 
            filter: brightness(1.1); 
        }

        .btn-purple { 
            background: var(--hero-purple-main); 
            border-bottom-color: var(--hero-purple-dark); 
        }

        .turn { 
            font-family: 'Bangers'; 
            font-size: 2.2rem; 
            color: var(--hero-yellow); 
            text-align: center; 
            margin-bottom: 10px; 
        }

        .scoreboard {
            display: flex;
            justify-content: space-around;
            background: rgba(0,0,0,0.3);
            padding: 15px;
            border-radius: 15px;
            margin-bottom: 20px;
            border: 1px solid var(--hero-purple-main);
        }

        .word-card {
            background: #1a102a;
            border: 3px solid var(--hero-purple-main);
            border-radius: 15px;
            padding: 25px;
            text-align: center;
        }

        .hint-text {
            font-size: 1.2rem;
            min-height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-style: italic;
            margin: 20px 0;
            background: rgba(0,0,0,0.2);
            border-radius: 10px;
            padding: 10px;
        }

        .answer-reveal {
            font-family: 'Bangers';
            font-size: 2rem;
            color: var(--hero-yellow);
            display: none;
            margin: 15px 0;
            padding: 10px;
            border: 2px dashed var(--hero-yellow);
        }

        footer {
            text-align: center;
            padding: 30px;
            color: rgba(255,255,255,0.5);
            width: 100%;
        }

        .flex-buttons { 
            display: grid; 
            grid-template-columns: 1fr 1fr; 
            gap: 10px; 
        }
    </style>
</head>
<body>

<header>
    <h1>PICKLE 3: PERSONAL DATA DETECTIVE</h1>
</header>

<div class="container">
    <div class="section" id="setup">
        <div class="instructions">
            🔎 <strong>Mission:</strong> Guess the word using as few hints as possible.<br>
            🌟 <strong>Bonus:</strong> Use <strong>English</strong> hints for +1 extra point!
        </div>
        
        <label>Number of Agents:</label>
        <select id="playerCount" onchange="togglePlayer2()">
            <option value="1">1 Agent</option>
            <option value="2" selected>2 Agents</option>
        </select>
        
        <label>Agent 1:</label>
        <input type="text" id="player1" placeholder="Name of Agent 1" />
        
        <div id="player2Section">
            <label>Agent 2:</label>
            <input type="text" id="player2" placeholder="Name of Agent 2" />
        </div>
        
        <button class="btn" style="margin-top: 30px;" onclick="startGame()">Start Mission 🚀</button>
    </div>

    <div id="game" style="display: none;">
        <div class="turn" id="turnIndicator">Turn: ...</div>
        
        <div class="scoreboard">
            <div><span id="name1"></span>: <span id="score1" style="color:var(--hero-yellow)">0</span></div>
            <div id="p2ScoreDisplay"><span id="name2"></span>: <span id="score2" style="color:var(--hero-yellow)">0</span></div>
        </div>
        
        <div class="word-card">
            <div class="answer-reveal" id="word-reveal">Answer: ...</div>
            
            <label>Hint Language:</label>
            <select id="hintLanguage" onchange="resetClue()">
                <option value="nl">Dutch</option>
                <option value="en">English (Bonus +1)</option>
            </select>
            
            <div class="hint-text" id="hintBox">Click 'Next Hint' to start</div>
            
            <div class="flex-buttons">
                <button class="btn btn-purple" onclick="nextHint()">Next Hint 💡</button>
                <button class="btn btn-purple" onclick="showWord()">Show Answer 👁️</button>
                <button class="btn" style="background:#4caf50; border-color:#2e7d32;" onclick="correctGuess()">Correct ✅</button>
                <button class="btn" style="background:var(--hero-orange); border-color:#bf360c;" onclick="wrongGuess()">Wrong ❌</button>
            </div>
        </div>
    </div>
</div>

<footer>
    &copy; 2026 EngliForce: Make English Your Superpower!
</footer>

<script>
    const wordList = [
        { en: "mate", hints: { nl: ["Ander woord voor vriend of maat.", "Iemand met wie je optrekt.", "Begint met de letter M."], en: ["A synonym for friend or pal.", "Someone you hang out with.", "Starts with the letter M."] }},
        { en: "classmate", hints: { nl: ["Iemand die bij jou in de klas zit.", "Je deelt een leraar en klaslokaal met deze persoon.", "Een vriend op school."], en: ["Someone who is in your class.", "You share a classroom with them.", "A peer at school."] }},
        { en: "neighbour", hints: { nl: ["Iemand die naast of vlak bij je woont.", "Je buurman of buurvrouw.", "Je ziet ze in je straat."], en: ["Someone who lives next door.", "A person in your street.", "Your nearby resident."] }},
        { en: "kind", hints: { nl: ["Aardig en vriendelijk zijn.", "Behulpzaam zijn voor anderen.", "Het tegenovergestelde van gemeen."], en: ["Being nice and polite.", "Helpful to others.", "The opposite of mean."] }},
        { en: "honest", hints: { nl: ["Geen leugens vertellen.", "Eerlijk zijn.", "De waarheid spreken."], en: ["Not telling lies.", "Always truthful.", "Someone you can trust."] }},
        { en: "laugh", hints: { nl: ["Geluid maken als iets grappig is.", "Lachen.", "Een glimlach met geluid."], en: ["To make sound when something is funny.", "What you do at a joke.", "A sound of joy."] }},
        { en: "each other", hints: { nl: ["Betekent 'elkaar'.", "Samen met een ander persoon.", "Bijvoorbeeld: we helpen..."], en: ["One another.", "Together reciprocally.", "For example: We help..."] }},
        { en: "quiet", hints: { nl: ["Stil of rustig.", "Wanneer er weinig of geen geluid is.", "Het tegenovergestelde van druk of luid."], en: ["Making little to no noise.", "Peaceful and calm.", "The opposite of loud."] }},
        { en: "describe", hints: { nl: ["Vertellen hoe iets of iemand eruitziet.", "Beschrijven.", "Details over iets geven."], en: ["To say what someone or something is like.", "Give details about an object or person.", "Explain appearance."] }},
        { en: "straight", hints: { nl: ["Haar zonder krullen.", "Steil of recht.", "Niet gebogen of krullend."], en: ["Hair without curls.", "Not bent or curved.", "Direct or linear."] }},
        { en: "curly", hints: { nl: ["Haar met veel krullen.", "Krullend.", "Het tegenovergestelde van steil haar."], en: ["Hair with spirals or loops.", "Not straight.", "Wavy or coiled hair."] }},
        { en: "handsome", hints: { nl: ["Een knappe jongen of man.", "Mooi van uiterlijk.", "Vaak gebruikt voor mannen."], en: ["Good-looking, usually for a boy or man.", "Attractive appearance.", "Charming looking."] }},
        { en: "pretty", hints: { nl: ["Mooi of knap.", "Vaak gebruikt voor meisjes, spullen of omgevingen.", "Aantrekkelijk."], en: ["Attractive or good-looking.", "Often used for girls or nice objects.", "Pleasant to look at."] }},
        { en: "clever", hints: { nl: ["Slim of pienter.", "Snel dingen begrijpen.", "Goed in het oplossen van problemen."], en: ["Smart and intelligent.", "Quick to understand things.", "Good at solving problems."] }},
        { en: "together", hints: { nl: ["Samen met anderen.", "Niet alleen.", "Als een groep of paar."], en: ["With each other.", "Not alone.", "As a pair or group."] }}
    ];

    let words = [];
    let p1 = '', p2 = '', playerCount = 2;
    let score = [0, 0];
    let currentIndex = 0;
    let currentHint = 0;
    let currentPlayer = 0;

    function togglePlayer2() {
        const val = document.getElementById("playerCount").value;
        document.getElementById("player2Section").style.display = (val === "1") ? "none" : "block";
    }

    function startGame() {
        playerCount = parseInt(document.getElementById("playerCount").value);
        p1 = document.getElementById("player1").value || "Agent 1";
        p2 = document.getElementById("player2").value || "Agent 2";

        words = [...wordList].sort(() => Math.random() - 0.5);

        score = [0, 0];
        currentIndex = 0;
        currentPlayer = 0;

        document.getElementById("name1").textContent = p1;
        document.getElementById("name2").textContent = (playerCount === 2) ? p2 : "";
        document.getElementById("p2ScoreDisplay").style.visibility = (playerCount === 2) ? "visible" : "hidden";

        document.getElementById("setup").style.display = "none";
        document.getElementById("game").style.display = "block";
        updateScore();
        showTurn();
        resetWordCard();
    }

    function showTurn() {
        const name = currentPlayer === 0 ? p1 : p2;
        document.getElementById("turnIndicator").textContent = (playerCount === 1) ? `Agent: ${p1}` : `Turn: ${name}`;
    }

    function resetWordCard() {
        currentHint = 0;
        document.getElementById("hintBox").textContent = "Click 'Next Hint' to start";
        document.getElementById("word-reveal").style.display = "none";
    }

    function nextHint() {
        if (currentHint >= 3) return;
        const lang = document.getElementById("hintLanguage").value;
        const hint = words[currentIndex].hints[lang][currentHint];
        document.getElementById("hintBox").textContent = `Hint ${currentHint + 1}: ${hint}`;
        currentHint++;
    }

    function showWord() {
        document.getElementById("word-reveal").textContent = `Answer: ${words[currentIndex].en}`;
        document.getElementById("word-reveal").style.display = "block";
    }

    function correctGuess() {
        const lang = document.getElementById("hintLanguage").value;
        let points = Math.max(1, 4 - currentHint);
        if (lang === "en") points += 1;
        score[currentPlayer] += points;
        nextWord();
    }

    function wrongGuess() {
        nextWord();
    }

    function nextWord() {
        currentIndex++;
        if (playerCount === 2) currentPlayer = 1 - currentPlayer;
        updateScore();
        if (currentIndex >= words.length) {
            document.getElementById("turnIndicator").textContent = "Mission Accomplished!";
            document.getElementById("hintBox").textContent = "All words discovered!";
            document.getElementById("word-reveal").style.display = "none";
        } else {
            showTurn();
            resetWordCard();
        }
    }

    function updateScore() {
        document.getElementById("score1").textContent = score[0] + " pt";
        document.getElementById("score2").textContent = score[1] + " pt";
    }

    function resetClue() {
        if (currentHint > 0) {
            const lang = document.getElementById("hintLanguage").value;
            const hint = words[currentIndex].hints[lang][currentHint - 1];
            document.getElementById("hintBox").textContent = `Hint ${currentHint}: ${hint}`;
        }
    }
</script>

</body>
</html>
