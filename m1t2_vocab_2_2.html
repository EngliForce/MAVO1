const documents = {"vocab": "<!DOCTYPE html>\n<html lang=\"nl\">\n<head>\n    <meta charset=\"UTF-8\">\n    <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n    <title>EngliForce Academy: Vocabulary 2.2 – Leisure<\/title>\n    <style>\n        :root {\n            --hero-purple-main: #43a047; /* Aangepast van paars naar oranje */\n            --hero-purple-dark: #388e3c; /* Donkeroranje variant */\n            --hero-yellow: #ffb703;\n            --hero-cyan: #81c784;\n            --dark-bg: #0b1a2a;\n            --hero-orange: #43a047;\n            --thumb-up: #4caf50;\n            --success-green: #2ecc71;\n        }\n        body {\n            font-family: 'Trebuchet MS', Arial, sans-serif, sans-serif;\n            background: radial-gradient(circle at center, #102a43 0%, #05101a 100%);\n            color: white;\n            margin: 0;\n            min-height: 100vh;\n            overflow-x: hidden;\n        }\n        header {\n            background: var(--hero-purple-main);\n            padding: 2.5rem 1rem;\n            text-align: center;\n            clip-path: polygon(0 0, 100% 0, 100% 85%, 0 100%);\n            border-bottom: 5px solid var(--hero-yellow);\n        }\n        h1 { font-family: Impact, 'Arial Narrow', sans-serif, cursive; font-size: 3.5rem; letter-spacing: 3px; margin: 0; text-shadow: 4px 4px 0px var(--hero-purple-dark); }\n        h2 { font-family: Impact, 'Arial Narrow', sans-serif, cursive; color: var(--hero-yellow); font-size: 2.2rem; margin-top: 10px; margin-bottom: 20px; border-bottom: 2px solid rgba(255,255,255,0.1); display: inline-block; padding-bottom: 5px; }\n        h3 { color: var(--hero-cyan); font-family: Impact, 'Arial Narrow', sans-serif; font-size: 1.8rem; margin-top: 0;}\n        main { max-width: 1200px; margin: 20px auto; padding: 20px; text-align: center; }\n        .section-divider {\n            height: 4px;\n            background: linear-gradient(90deg, transparent, var(--hero-cyan), transparent);\n            margin: 50px 0;\n            opacity: 0.8;\n            border-radius: 2px;\n            box-shadow: 0 0 15px var(--hero-cyan);\n        }\n        .briefing-box {\n            background: rgba(16, 42, 67, 0.9);\n            border: 2px solid var(--hero-cyan);\n            border-radius: 20px;\n            padding: 30px;\n            margin-bottom: 30px;\n            box-shadow: 0 0 30px rgba(0,0,0,0.5);\n            text-align: left;\n        }\n        .explanation-text {\n            font-size: 1.1rem; line-height: 1.6; margin-bottom: 25px;\n            border-left: 4px solid var(--hero-orange); padding-left: 20px;\n            background: rgba(67, 160, 71, 0.05); padding-top: 10px; padding-bottom: 10px;\n        }\n        .keyword { color: var(--hero-orange); font-weight: 700; }\n        .toggle-container { display: flex; gap: 10px; justify-content: center; margin-bottom: 30px; flex-wrap: wrap; }\n        .btn-toggle {\n            background: var(--hero-purple-main); color: white; border: none;\n            padding: 10px 20px; border-radius: 50px; font-family: Impact, 'Arial Narrow', sans-serif, cursive;\n            font-size: 1.1rem; cursor: pointer; transition: 0.2s; border-bottom: 4px solid var(--hero-purple-dark);\n        }\n        .btn-toggle:hover { transform: translateY(-2px); background: var(--hero-cyan); color: var(--hero-purple-dark); }\n        .btn-video { background: var(--hero-orange); border-bottom-color: #388e3c; }\n        .btn-video:hover { background: #66bb6a; color: white; }\n\n        .table-container { overflow-x:auto; width: 100%; border-radius: 15px; background: #102a43; overflow: hidden; margin-top: 20px; text-align: left; }\n        table { width: 100%; border-collapse: collapse; }\n        th { background: var(--hero-purple-main); padding: 15px; text-align: left; font-family: Impact, 'Arial Narrow', sans-serif; }\n        td { padding: 12px 15px; border-bottom: 1px solid rgba(255,255,255,0.1); }\n\n        .content-section { display: none; animation: fadeIn 0.4s ease-out; }\n        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }\n\n        /* FLASHCARDS */\n        .controls { background: rgba(16, 42, 67, 0.8); padding: 20px; border-radius: 15px; border: 1px solid var(--hero-cyan); display: flex; flex-wrap: wrap; gap: 15px; justify-content: center; align-items: center; margin-bottom: 30px; }\n        .controls label { font-family: Impact, 'Arial Narrow', sans-serif; font-size: 1.1rem; color: var(--hero-cyan); display: flex; align-items: center; gap: 5px; cursor: pointer; }\n        .flashcards-container { display: flex; flex-wrap: wrap; justify-content: center; gap: 25px; margin-top: 20px; min-height: 300px; }\n        \n        .card { width: 280px; height: 260px; perspective: 1000px; position: relative; transition: transform 0.4s, opacity 0.4s; }\n        .card-inner { position: relative; width: 100%; height: 100%; text-align: center; transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1); transform-style: preserve-3d; cursor: pointer; }\n        .card.flipped .card-inner { transform: rotateY(180deg); }\n        .card-front, .card-back { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; border-radius: 20px; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 15px; box-sizing: border-box; border: 4px solid var(--hero-cyan); }\n        .card-front { background: var(--hero-purple-dark); color: white; font-size: 1.8rem; font-family: Impact, 'Arial Narrow', sans-serif; transition: border-color 0.3s, box-shadow 0.3s; }\n        .card-back { background: var(--hero-yellow); color: var(--dark-bg); transform: rotateY(180deg); font-size: 1.6rem; font-family: Impact, 'Arial Narrow', sans-serif; }\n        \n        /* Bekend Status */\n        .known-btn {\n            margin-top: 15px;\n            background: rgba(0,0,0,0.1);\n            color: var(--dark-bg);\n            border: 2px solid var(--dark-bg);\n            padding: 8px 15px;\n            border-radius: 10px;\n            font-family: 'Trebuchet MS', Arial, sans-serif, sans-serif;\n            font-weight: bold;\n            font-size: 0.8rem;\n            cursor: pointer;\n            transition: 0.3s;\n        }\n        .known-btn:hover { background: rgba(0,0,0,0.2); transform: scale(1.05); }\n        .card.is-known .card-front { border-color: var(--success-green); box-shadow: 0 0 15px rgba(46, 204, 113, 0.6); }\n\n        .card-example { font-family: 'Trebuchet MS', Arial, sans-serif, sans-serif; font-size: 0.85rem; margin-top: 10px; font-style: italic; color: rgba(255,255,255,0.8); backface-visibility: hidden; }\n        .card-back .card-example { color: rgba(0,0,0,0.7); }\n\n        /* PICKLE GRID */\n        .pickle-grid { display: flex; flex-wrap: wrap; justify-content: center; gap: 25px; margin-top: 20px; }\n        .mission-card { background: #102a43; border: 3px solid #243b53; border-radius: 20px; padding: 25px; text-align: center; cursor: pointer; transition: 0.3s; width: 220px; display: flex; flex-direction: column; justify-content: space-between; }\n        .mission-card:hover { border-color: var(--hero-yellow); transform: translateY(-5px); }\n        .mission-card .title { font-family: Impact, 'Arial Narrow', sans-serif; font-size: 1.5rem; color: var(--hero-yellow); margin: 5px 0; }\n        .like-btn { background: rgba(255, 255, 255, 0.05); border: 2px solid var(--hero-cyan); border-radius: 10px; color: white; padding: 8px; margin-top: 15px; cursor: pointer; transition: 0.3s; font-family: 'Trebuchet MS', Arial, sans-serif, sans-serif; display: flex; align-items: center; justify-content: center; gap: 8px; }\n        .like-btn.liked { background: var(--thumb-up); border-color: white; }\n\n        /* EFFECTS */\n        .flash-effect { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: white; opacity: 0; pointer-events: none; z-index: 1999; }\n        .boom-text { position: fixed; pointer-events: none; font-family: Impact, 'Arial Narrow', sans-serif, cursive; color: var(--hero-yellow); font-size: 4rem; z-index: 2001; text-shadow: 3px 3px 0px #000; animation: boomAnim 0.6s ease-out forwards; }\n        @keyframes boomAnim { 0% { transform: scale(0); opacity: 1; } 100% { transform: scale(1.5); opacity: 0; } }\n        .shake { animation: shake 0.2s ease-in-out; }\n        @keyframes shake { 0%, 100% { transform: translate(0,0); } 25% { transform: translate(-5px, 5px); } 50% { transform: translate(5px, -5px); } }\n        footer { text-align: center; padding: 40px; color: rgba(255,255,255,0.5); font-size: 0.9rem; }\n    <\/style>\n<style>html,body{min-height:0!important} html{overflow:hidden} .back-to-vocab{display:block;margin:20px auto 10px} @media(max-width:650px){ header h1{font-size:clamp(1.7rem,7vw,2.5rem);letter-spacing:1px} main,.container{padding:12px} .briefing-box{padding:18px} .mission-card{width:min(100%,250px)} .exercise-grid{grid-template-columns:1fr} .toggle-container{gap:8px} .language-select{flex-wrap:wrap;border-radius:16px} } <\/style>\n<\/head>\n<body>\n\n<div class=\"flash-effect\" id=\"flash\"><\/div>\n<header>\n    <h1>ENGLIFORCE ACADEMY<\/h1>\n    <p>VOCAB 2.2: LEISURE<\/p>\n<\/header>\n\n<main>\n    <section class=\"briefing-box\">\n        <h2>🚨 MISSION: VOCABULARY BRIEFING<\/h2>\n        <div class=\"explanation-text\">\n            Leer 15 woorden en uitdrukkingen over hobby’s en vrije tijd. Gebruik de <strong>video<\/strong> voor uitspraak en de <strong>flashcards<\/strong> om te oefenen.\n        <\/div>\n    <\/section>\n\n    <div class=\"section-divider\"><\/div>\n\n    <div class=\"toggle-container\">\n        <button class=\"btn-toggle\" onclick=\"showSection(event, 'vocab-list', 'ZAP!')\">Lijst<\/button>\n        <button class=\"btn-toggle\" onclick=\"showSection(event, 'context-list', 'KA-POW!')\">Context<\/button>\n        <button class=\"btn-toggle\" onclick=\"showSection(event, 'flashcards-section', 'BOOST!')\">Flashcards<\/button>\n        <button class=\"btn-toggle btn-video\" onclick=\"showSection(event, 'video-section', 'BOOM!')\">Video<\/button>\n        <button class=\"btn-toggle\" onclick=\"showSection(event, 'note-section', 'LET OP!')\">⚠️ LET OP!<\/button>\n    <\/div>\n\n    <div id=\"vocab-list\" class=\"content-section\" style=\"display: block;\">\n        <h3>Tactisch Overzicht<\/h3>\n        <div class=\"table-container\">\n            <table>\n                <thead><tr><th>Engels<\/th><th>Nederlands<\/th><\/tr><\/thead>\n                <tbody id=\"vocab-table-body\"><\/tbody>\n            <\/table>\n        <\/div>\n    <\/div>\n\n    <div id=\"context-list\" class=\"content-section\">\n        <h3>Action Lab (Zinnen)<\/h3>\n        <div class=\"table-container\">\n            <table>\n                <thead><tr><th>Woord<\/th><th>Zin<\/th><\/tr><\/thead>\n                <tbody id=\"context-table-body\"><\/tbody>\n            <\/table>\n        <\/div>\n    <\/div>\n\n    <div id=\"flashcards-section\" class=\"content-section\">\n        <h3>Flashcard Simulator<\/h3>\n        <div class=\"controls\">\n            <label>Aantal: \n                <select id=\"card-count\" onchange=\"generateCards()\">\n                    <option value=\"5\">5<\/option>\n                    <option value=\"10\">10<\/option>\n                    <option value=\"15\" selected>Alle<\/option>\n                <\/select>\n            <\/label>\n            <label><input type=\"checkbox\" id=\"show-examples\" onchange=\"generateCards()\"> Voorbeelden<\/label>\n            <label><input type=\"checkbox\" id=\"reverse-cards\" onchange=\"generateCards()\"> NL → EN<\/label>\n            <label style=\"color: var(--success-green);\"><input type=\"checkbox\" id=\"hide-known\" onchange=\"generateCards()\"> Verberg gekende woorden<\/label>\n            <button class=\"btn-toggle\" onclick=\"resetKnown()\" style=\"padding: 5px 10px; font-size: 0.8rem; background: #444;\">Reset voortgang<\/button>\n            <button class=\"btn-toggle btn-action\" onclick=\"generateCards()\">Husselen 🔄<\/button>\n        <\/div>\n        <div class=\"flashcards-container\" id=\"flashcards-container\"><\/div>\n    <\/div>\n\n    <div id=\"video-section\" class=\"content-section\">\n        <h3>🎬 Uitspraak Training<\/h3>\n        <div style=\"max-width:800px;margin:auto;\">\n            <div class=\"briefing-box\" style=\"text-align:center;\">\n                <p><strong>Privacy:<\/strong> Deze video wordt pas geladen als je op <strong>Video starten<\/strong> klikt. Daarna maakt je browser verbinding met YouTube. YouTube kan daarbij gegevens verwerken. We gebruiken de privacyvriendelijkere <code>youtube-nocookie.com<\/code>-embed, maar kunnen niet garanderen dat YouTube geen gegevens verwerkt.<\/p>\n                <button type=\"button\" class=\"btn-toggle btn-video\" id=\"load-video-btn\" onclick=\"loadVideo()\">▶ Video starten<\/button>\n                <div id=\"youtube-host\" style=\"margin-top:20px;\"><\/div>\n            <\/div>\n        <\/div>\n    <\/div>\n\n\n    <div id=\"note-section\" class=\"content-section\">\n        <h3>⚠️ LET OP! – Play, go or do?<\/h3>\n        <div class=\"briefing-box\">\n            <div class=\"explanation-text\">\n                In het Engels gebruik je bij sporten vaak <strong>play<\/strong>, <strong>go<\/strong> of <strong>do<\/strong>.\n                Hiermee kun je heel veel verschillende sporten benoemen!\n            <\/div>\n            <div class=\"table-container\">\n                <table>\n                    <thead><tr><th>Werkwoord<\/th><th>Wanneer?<\/th><th>Voorbeelden<\/th><\/tr><\/thead>\n                    <tbody>\n                        <tr><td><strong>PLAY<\/strong><\/td><td>Vaak bij bal- en teamsporten<\/td><td><strong>play<\/strong> football, <strong>play<\/strong> tennis, <strong>play<\/strong> hockey<\/td><\/tr>\n                        <tr><td><strong>GO<\/strong><\/td><td>Vaak bij activiteiten met -ing<\/td><td><strong>go<\/strong> swimming, <strong>go<\/strong> cycling, <strong>go<\/strong> running<\/td><\/tr>\n                        <tr><td><strong>DO<\/strong><\/td><td>Vaak bij andere sporten en oefeningen<\/td><td><strong>do<\/strong> karate, <strong>do<\/strong> gymnastics, <strong>do<\/strong> yoga<\/td><\/tr>\n                    <\/tbody>\n                <\/table>\n            <\/div>\n            <p style=\"line-height:1.7;\"><strong>Remember!<\/strong> I <strong>play<\/strong> football every Saturday. She <strong>goes<\/strong> swimming on Mondays. He <strong>does<\/strong> karate twice a week.<\/p>\n            <p style=\"opacity:.8;font-size:.92rem;\">Dit zijn handige vuistregels. Er zijn uitzonderingen.<\/p>\n        <\/div>\n    <\/div>\n\n    <div class=\"section-divider\"><\/div>\n\n    <h2>⚔️ PICKLE MISSIONS<\/h2>\n    <div class=\"pickle-grid\">\n        <div class=\"mission-card\" onclick=\"openPickle(event, 'pickle1', 'CRUNCH!')\">\n            <div><div class=\"title\">🧩 Pickle 1<\/div><p>Drag & Drop<\/p><\/div>\n            <button class=\"like-btn\" onclick=\"toggleLike(event, this)\">🏆 ACHIEVED<\/button>\n        <\/div>\n        <div class=\"mission-card\" onclick=\"openPickle(event, 'pickle2', 'SQUASH!')\">\n            <div><div class=\"title\">🧠 Pickle 2<\/div><p>Vocab Grid<\/p><\/div>\n            <button class=\"like-btn\" onclick=\"toggleLike(event, this)\">🏆 ACHIEVED<\/button>\n        <\/div>\n        <div class=\"mission-card\" onclick=\"openPickle(event, 'pickle3', 'KABOOM!')\">\n            <div><div class=\"title\">🔎 Pickle 3<\/div><p>Vocab Detective<\/p><\/div>\n            <button class=\"like-btn\" onclick=\"toggleLike(event, this)\">🏆 ACHIEVED<\/button>\n        <\/div>\n    <\/div>\n<\/main>\n\n<footer><p>&copy; 2026 EngliForce: Make English Your Superpower!<\/p><\/footer>\n\n<script>\n    /* Vocab 2.2: Leisure – de vijftien vastgestelde leerwoorden */\n    const flashcardsData = [{\"en\": \"leisure\", \"nl\": \"vrije tijd\", \"exEN\": \"In my leisure time, I like reading.\", \"exNL\": \"In mijn vrije tijd lees ik graag.\", \"highlight\": \"leisure\"}, {\"en\": \"an activity\", \"nl\": \"een activiteit\", \"exEN\": \"Swimming is a fun activity.\", \"exNL\": \"Zwemmen is een leuke activiteit.\", \"highlight\": \"activity\"}, {\"en\": \"a board game\", \"nl\": \"een bordspel\", \"exEN\": \"We play a board game after dinner.\", \"exNL\": \"We spelen na het eten een bordspel.\", \"highlight\": \"board game\"}, {\"en\": \"a collection\", \"nl\": \"een verzameling\", \"exEN\": \"He has a collection of football cards.\", \"exNL\": \"Hij heeft een verzameling voetbalkaartjes.\", \"highlight\": \"collection\"}, {\"en\": \"a skill\", \"nl\": \"een vaardigheid\", \"exEN\": \"Cooking is a useful skill.\", \"exNL\": \"Koken is een nuttige vaardigheid.\", \"highlight\": \"skill\"}, {\"en\": \"to write stories\", \"nl\": \"verhalen schrijven\", \"exEN\": \"She loves to write stories in her notebook.\", \"exNL\": \"Zij schrijft graag verhalen in haar schrift.\", \"highlight\": \"write stories\"}, {\"en\": \"to bake\", \"nl\": \"bakken\", \"exEN\": \"We bake biscuits on Saturday.\", \"exNL\": \"Wij bakken op zaterdag koekjes.\", \"highlight\": \"bake\"}, {\"en\": \"to build\", \"nl\": \"bouwen\", \"exEN\": \"They build models at home.\", \"exNL\": \"Zij bouwen thuis modellen.\", \"highlight\": \"build\"}, {\"en\": \"to take photos\", \"nl\": \"foto's maken\", \"exEN\": \"I take photos in the park.\", \"exNL\": \"Ik maak foto's in het park.\", \"highlight\": \"take photos\"}, {\"en\": \"to do crafts\", \"nl\": \"knutselen\", \"exEN\": \"We do crafts at school.\", \"exNL\": \"Wij knutselen op school.\", \"highlight\": \"do crafts\"}, {\"en\": \"to play a sport\", \"nl\": \"een sport beoefenen\", \"exEN\": \"My brother likes to play a sport after school.\", \"exNL\": \"Mijn broer doet graag na school een sport.\", \"highlight\": \"play a sport\"}, {\"en\": \"to play an instrument\", \"nl\": \"een instrument bespelen\", \"exEN\": \"Can you play an instrument?\", \"exNL\": \"Kun jij een instrument bespelen?\", \"highlight\": \"play an instrument\"}, {\"en\": \"to try out\", \"nl\": \"uitproberen\", \"exEN\": \"I want to try out a new hobby.\", \"exNL\": \"Ik wil een nieuwe hobby uitproberen.\", \"highlight\": \"try out\"}, {\"en\": \"to be keen on\", \"nl\": \"dol zijn op\", \"exEN\": \"She is keen on painting.\", \"exNL\": \"Zij is dol op schilderen.\", \"highlight\": \"keen on\"}, {\"en\": \"to be good at\", \"nl\": \"goed zijn in\", \"exEN\": \"He is good at baking.\", \"exNL\": \"Hij is goed in bakken.\", \"highlight\": \"good at\"}];\n\n    let knownWords = []; try { knownWords = JSON.parse(localStorage.getItem('engliforce_v22_leisure_known') || '[]'); } catch (_) {}\n\n    function init() {\n        const vBody = document.getElementById('vocab-table-body');\n        const cBody = document.getElementById('context-table-body');\n        flashcardsData.forEach(item => {\n            vBody.innerHTML += `<tr><td>${item.en}<\/td><td>${item.nl}<\/td><\/tr>`;\n            const base = item.highlight || item.en.replace(/^(to |a |an )/, '');\n            const highlightedEx = item.exEN.replace(new RegExp(base, 'gi'), match => `<span class=\"keyword\">${match}<\/span>`);\n            cBody.innerHTML += `<tr><td>${item.en}<\/td><td>${highlightedEx}<br><small style=\"opacity:0.6\">${item.exNL}<\/small><\/td><\/tr>`;\n        });\n        generateCards();\n    }\n\n    function generateCards() {\n        const container = document.getElementById('flashcards-container');\n        const countSelect = document.getElementById('card-count');\n        const count = countSelect.value === \"15\" ? flashcardsData.length : parseInt(countSelect.value);\n        const showEx = document.getElementById('show-examples').checked;\n        const reversed = document.getElementById('reverse-cards').checked;\n        const hideKnown = document.getElementById('hide-known').checked;\n        \n        container.innerHTML = '';\n        \n        let filteredData = [...flashcardsData];\n        if (hideKnown) {\n            filteredData = filteredData.filter(word => !knownWords.includes(word.en));\n        }\n\n        let data = filteredData.sort(() => 0.5 - Math.random()).slice(0, count);\n        \n        if (data.length === 0 && hideKnown) {\n            container.innerHTML = \"<p style='font-family:Bangers; font-size:1.5rem; color:var(--hero-yellow);'>Missie volbracht! Geen ongekende woorden meer in deze selectie.<\/p>\";\n            return;\n        }\n\n        data.forEach(word => {\n            const isKnown = knownWords.includes(word.en);\n            const cardWrap = document.createElement('div'); \n            cardWrap.className = `card ${isKnown ? 'is-known' : ''}`;\n            \n            const inner = document.createElement('div'); \n            inner.className = 'card-inner';\n            inner.onclick = () => cardWrap.classList.toggle('flipped');\n\n            const front = document.createElement('div'); \n            front.className = 'card-front';\n            front.innerHTML = reversed ? word.nl : word.en;\n            if (showEx) front.innerHTML += `<div class=\"card-example\">${reversed ? word.exNL : word.exEN}<\/div>`;\n\n            const back = document.createElement('div'); \n            back.className = 'card-back';\n            back.innerHTML = reversed ? word.en : word.nl;\n            if (showEx) back.innerHTML += `<div class=\"card-example\">${reversed ? word.exEN : word.exNL}<\/div>`;\n\n            const kBtn = document.createElement('button');\n            kBtn.className = 'known-btn';\n            \n            updateBtnStyle(kBtn, isKnown);\n            \n            kBtn.onclick = (e) => {\n                e.stopPropagation();\n                toggleKnown(e, word.en, cardWrap, kBtn);\n            };\n\n            back.appendChild(kBtn);\n            inner.appendChild(front); \n            inner.appendChild(back);\n            cardWrap.appendChild(inner);\n            container.appendChild(cardWrap);\n        });\n    }\n\n    function toggleKnown(e, wordEn, cardElem, btn) {\n        const index = knownWords.indexOf(wordEn);\n        const hideKnown = document.getElementById('hide-known').checked;\n\n        if (index === -1) {\n            knownWords.push(wordEn);\n            createExplosion(e, 'CHECK!');\n            \n            if (hideKnown) {\n                cardElem.style.transform = 'scale(0)';\n                cardElem.style.opacity = '0';\n                setTimeout(() => generateCards(), 400);\n            } else {\n                cardElem.classList.add('is-known');\n                updateBtnStyle(btn, true);\n            }\n        } else {\n            knownWords.splice(index, 1);\n            createExplosion(e, 'RESET!');\n            cardElem.classList.remove('is-known');\n            updateBtnStyle(btn, false);\n        }\n        \n        try { localStorage.setItem('engliforce_v22_leisure_known', JSON.stringify(knownWords)); } catch (_) {}\n    }\n\n    function updateBtnStyle(btn, isKnown) {\n        if (isKnown) {\n            btn.innerHTML = '✅ Gekend';\n            btn.style.background = 'var(--success-green)';\n            btn.style.color = 'white';\n            btn.style.borderColor = 'white';\n        } else {\n            btn.innerHTML = '✔️ Ken ik';\n            btn.style.background = 'rgba(0,0,0,0.1)';\n            btn.style.color = 'var(--dark-bg)';\n            btn.style.borderColor = 'var(--dark-bg)';\n        }\n    }\n\n    function resetKnown() {\n        if(confirm(\"Wil je al je voortgang wissen?\")) {\n            knownWords = [];\n            try { localStorage.removeItem('engliforce_v22_leisure_known'); } catch (_) {}\n            generateCards();\n        }\n    }\n\n    function toggleLike(e, btn) {\n        e.stopPropagation();\n        btn.classList.toggle('liked');\n        btn.innerText = btn.classList.contains('liked') ? '✅ ACHIEVED' : '🏆 ACHIEVED';\n        try { localStorage.setItem('engliforce_v22_leisure_achieved', JSON.stringify(Array.from(document.querySelectorAll('.like-btn')).map(b => b.classList.contains('liked')))); } catch (_) {}\n        if(btn.classList.contains('liked')) createExplosion(e, 'AWESOME!');\n    }\n\n    function openPickle(e, url, msg) {\n        createExplosion(e, msg);\n        setTimeout(() => window.parent.postMessage({type:'engliforce-nav',view:url}, '*'), 250);\n    }\n\n    function showSection(e, id, msg) {\n        if (id !== 'video-section') {\n            document.getElementById('youtube-host').replaceChildren();\n            document.getElementById('load-video-btn').style.display = '';\n        }\n        document.querySelectorAll('.content-section').forEach(s => s.style.display = 'none');\n        document.getElementById(id).style.display = 'block';\n        createExplosion(e, msg);\n    }\n\n    function createExplosion(e, message) {\n        const x = e.clientX || window.innerWidth/2; \n        const y = e.clientY || window.innerHeight/2;\n        const flash = document.getElementById('flash');\n        flash.style.opacity = '0.3'; \n        document.body.classList.add('shake');\n        setTimeout(() => { flash.style.opacity = '0'; document.body.classList.remove('shake'); }, 200);\n        const txt = document.createElement('div'); \n        txt.className = 'boom-text'; \n        txt.innerText = message;\n        txt.style.left = (x - 50) + 'px'; \n        txt.style.top = (y - 50) + 'px';\n        document.body.appendChild(txt); \n        setTimeout(() => txt.remove(), 600);\n    }\n\n    function loadVideo() {\n        const host = document.getElementById('youtube-host');\n        if (host.querySelector('iframe')) return;\n        const wrapper = document.createElement('div');\n        wrapper.style.cssText = 'position:relative;padding-top:56.25%;bo wrap:wrap;border-radius:16px} } <\/style>\n<\/head>\n<body>\n\n<header>\n    <h1>PICKLE 1: LEISURE<\/h1>\n    <p>sleep de woorden naar de juiste omschrijving<\/p>\n<\/header>\n\n<div class=\"container\">\n    <div class=\"language-select\">\n        <label><input type=\"radio\" name=\"language\" value=\"nl\" checked onchange=\"setupGame()\"> nederlands<\/label>\n        <label><input type=\"radio\" name=\"language\" value=\"en\" onchange=\"setupGame()\"> english<\/label>\n        <label><input type=\"radio\" name=\"language\" value=\"mixed\" onchange=\"setupGame()\"> mixed mode<\/label>\n    <\/div>\n\n    <div class=\"word-bank\" id=\"wordBank\"><\/div>\n    <div class=\"exercise-grid\" id=\"sentenceGrid\"><\/div>\n\n    <div class=\"button-row\">\n        <button class=\"btn\" onclick=\"checkAnswers(event)\">controleer ✅<\/button>\n        <button class=\"btn\" style=\"background:var(--hero-purple-main); border-bottom-color:var(--hero-purple-dark);\" onclick=\"setupGame()\">opnieuw 🔁<\/button>\n        <button class=\"btn\" onclick=\"returnToVocab()\">← Terug naar Vocab<\/button>\n    <\/div>\n<\/div>\n\n<footer>\n    &copy; 2026 EngliForce: Make English Your Superpower!\n<\/footer>\n\n<script>\n    const vocabData = {\"leisure\": {\"nl\": \"Vrije tijd waarin je doet wat je leuk vindt.\", \"en\": \"Free time to relax or enjoy yourself.\"}, \"an activity\": {\"nl\": \"Iets wat je doet, zoals zwemmen, koken of wandelen.\", \"en\": \"Something you do, such as swimming or cooking.\"}, \"a board game\": {\"nl\": \"Een spel met een speelbord, vaak met pionnen of dobbelstenen.\", \"en\": \"A game played on a table, often with pieces and dice.\"}, \"a collection\": {\"nl\": \"Een groep voorwerpen die je bewaart, bijvoorbeeld voetbalkaartjes.\", \"en\": \"A group of things you keep, like cards or coins.\"}, \"a skill\": {\"nl\": \"Iets wat je hebt geleerd en steeds beter kunt.\", \"en\": \"Something you have learnt how to do well.\"}, \"to write stories\": {\"nl\": \"Zelf \n            el.addEventListener('dragstart', e => e.dataTransfer.setData(\"text\", word));\n            wordBank.appendChild(el);\n        });\n\n        const lang = document.querySelector('input[name=\"language\"]:checked').value;\n        \n        selectedWords.forEach((word, index) => {\n            let desc = lang === 'en' ? vocabData[word].en :\n                       lang === 'nl' ? vocabData[word].nl :\n                       (Math.random() > 0.5 ? vocabData[word].nl : vocabData[word].en);\n\n            const box = document.createElement('div');\n            box.className = 'sentence-box';\n            box.innerHTML = `\n                <p><strong>mission ${index + 1}:<\/strong> ${desc}<\/p>\n                <div class=\"drop-zone\" data-word=\"${word}\"><\/div>\n            `;\n            \n            const zone = box.querySelector('.drop-zone');\n            zone.addEventListener('dragover', e => { e.preventDefault(); zone.classList.add('drag-over'); });\n            zone.addEventListener('dragleave', () => zone.classList.remove('drag-over'));\n            zone.addEventListener('drop', e => {\n                e.preventDefault();\n                zone.classList.remove('drag-over');\n                const droppedWord = e.dataTransfer.getData(\"text\");\n                zone.innerHTML = `<div class=\"draggable-word\" draggable=\"true\">${droppedWord}<\/div>`;\n                zone.querySelector('.draggable-word').addEventListener('dragstart', ev => ev.dataTransfer.setData(\"text\", droppedWord));\n            });\n            \n            sentenceGrid.appendChild(box);\n        });\n    }\n\n    function checkAnswers(e) {\n        let allCorrect = true;\n        document.querySelectorAll('.drop-zone').forEach(zone => {\n            const correctWord = zone.getAttribute('data-word');\n            const userWord = zone.textContent.trim();\n            zone.classList.remove('correct', 'wrong');\n\n            if (userWord === correctWord) {\n                zone.classList.add('correct');\n            } else if (userWord !== \"\") {\n                zone.classList.add('wrong');\n                allCorrect = false;\n            } else {\n                allCorrect = false;\n            }\n        });\n        \n        createExplosion(e, allCorrect ? 'mission complete!' : 'check again!');\n    }\n\n    function createExplosion(e, message) {\n        const txt = document.createElement('div');\n        txt.className = 'boom-text';\n        txt.innerText = message;\n        txt.style.left = (e.clientX - 50) + 'px';\n        txt.style.top = (e.clientY - 50) + 'px';\n        document.body.appendChild(txt);\n        setTimeout(() => txt.remove(), 600);\n    }\n\n    function returnToVocab() { window.parent.postMessage({type:'engliforce-nav',view:'vocab'}, '*'); }\n    window.onload = setupGame;\n<\/script>\n\n<script>\n(function(){\n  function report(){\n    const height=Math.ceil(document.body.scrollHeight);\n    window.parent.postMessage({type:'engliforce-height',height:height},'*');\n  }\n  window.addEventListener('load',report);\n  if ('ResizeObserver' in window) new ResizeObserver(report).observe(document.body);\n  document.addEventListener('click',()=>setTimeout(report,90));\n  setTimeout(report,80);\n})();\n<\/script>\n<\/body>\n<\/html>", "pickle2": "<!DOCTYPE html>\n<html lang=\"nl\">\n<head>\n    <meta charset=\"UTF-8\">\n    <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n    <title>EngliForce Pickle: Leisure Grid Challenge<\/title>\n    <style>\n        :root {\n            --hero-purple-main: #43a047;\n            --hero-purple-dark: #388e3c;\n            --hero-yellow: #ffb703;\n            --hero-cyan: #81c784;\n            --dark-bg: #0b1a2a;\n            --hero-orange: #43a047;\n        }\n\n        body {\n            font-family: 'Trebuchet MS', Arial, sans-serif, sans-serif;\n            background: radial-gradient(circle at center, #102a43 0%, #05101a 100%);\n            colo isabled) { \n            transform: translateY(-3px); \n            filter: brightness(1.1); \n        }\n\n        .btn:disabled { \n            opacity: 0.5; \n            cursor: not-allowed; \n        }\n\n        .btn-start { \n            background: var(--hero-purple-main); \n            border-bottom-color: var(--hero-purple-dark); \n        }\n\n        .confetti { \n            font-size: 40px; \n            animation: pop 0.5s ease-in-out; \n            display: inline-block; \n        }\n\n        @keyframes pop { \n            0% { transform: scale(0); } \n            100% { transform: scale(1); } \n        }\n\n        footer {\n            text-align: center;\n            padding: 30px;\n            color: rgba(255,255,255,0.5);\n            margin-top: 50px;\n        }\n    <\/style>\n<style>html,body{min-height:0!important} html{overflow:hidden} .back-to-vocab{display:block;margin:20px auto 10px} @media(max-width:650px){ header h1{font-size:clamp(1.7rem,7vw,2.5rem);letter-spacing:1px} main,.container{padding:12px} .briefing-box{padding:18px} .mission-card{width:min(100%,250px)} .exercise-grid{grid-template-columns:1fr} .toggle-container{gap:8px} .language-select{flex-wrap:wrap;border-radius:16px} } <\/style>\n<\/head>\n<body>\n\n<header>\n    <h1>PICKLE 2: LEISURE GRID<\/h1>\n    <p>Onthoud de posities en vind het juiste woord!<\/p>\n<\/header>\n\n<main>\n    <section>\n        <div class=\"setup\">\n            <select id=\"playerMode\">\n                <option value=\"1\">1 player<\/option>\n                <option value=\"2\">2 players<\/option>\n            <\/select>\n            <input type=\"text\" id=\"player1\" placeholder=\"Name player 1\" />\n            <input type=\"text\" id=\"player2\" placeholder=\"Name player 2\" />\n            <select id=\"direction\">\n                <option value=\"en-nl\">English → Dutch<\/option>\n                <option value=\"nl-en\">Dutch → English<\/option>\n            <\/select>\n            <button class=\"btn btn-start\" onclick=\"startGame()\">Start mission<\/button>\n        <\/div>\n\n        <div class=\"turn\" id=\"turnDisplay\"><\/div>\n        <div class=\"grid\" id=\"grid\"><\/div>\n\n        <div class=\"controls\">\n            <button class=\"btn\" onclick=\"showQuestion()\" id=\"readyBtn\" disabled>Ready!!<\/button>\n            <button class=\"btn\" onclick=\"nextRound()\" id=\"nextBtn\" style=\"display: none;\">Next round<\/button>\n        <\/div>\n\n        <div class=\"score\" id=\"scoreDisplay\"><\/div>\n        <div class=\"result\" id=\"resultDisplay\"><\/div>\n        <button class=\"btn\" type=\"button\" onclick=\"returnToVocab()\">← Terug naar Vocab<\/button>\n    <\/section>\n<\/main>\n\n<footer>\n    &copy; 2026 EngliForce: Make English Your Superpower!\n<\/footer>\n\n<script>\n    const wordList = [{\"en\": \"leisure\", \"nl\": \"vrije tijd\"}, {\"en\": \"an activity\", \"nl\": \"een activiteit\"}, {\"en\": \"a board game\", \"nl\": \"een bordspel\"}, {\"en\": \"a collection\", \"nl\": \"een verzameling\"}, {\"en\": \"a skill\", \"nl\": \"een vaardigheid\"}, {\"en\": \"to write stories\", \"nl\": \"verhalen schrijven\"}, {\"en\": \"to bake\", \"nl\": \"bakken\"}, {\"en\": \"to build\", \"nl\": \"bouwen\"}, {\"en\": \"to take photos\", \"nl\": \"foto's maken\"}, {\"en\": \"to do crafts\", \"nl\": \"knutselen\"}, {\"en\": \"to play a sport\", \"nl\": \"een sport beoefenen\"}, {\"en\": \"to play an instrument\", \"nl\": \"een instrument bespelen\"}, {\"en\": \"to try out\", \"nl\": \"uitproberen\"}, {\"en\": \"to be keen on\", \"nl\": \"dol zijn op\"}, {\"en\": \"to be good at\", \"nl\": \"goed zijn in\"}];\n\n    let currentGrid = [];\n    let correctIndex = -1;\n    let currentPlayer = 0;\n    let players = [];\n    let scores = [];\n    let rounds = [];\n    let mode = 1;\n    let direction = \"en-nl\";\n    const totalRounds = 5;\n    function returnToVocab() { window.parent.postMessage({type:'engliforce-nav',view:'vocab'}, '*'); }\n\n    function getRandomWords(count) {\n        return [...wordList].sort(() => 0.5 - Math.random()).slice(0, count);\n    }\n\n    function startGame() {\n        mode = parseInt(document.getElementById(\"playerMode\").value);\n        direction = document.getElementById(\"direction\").value;\n\n        const p1 = document.getElementById(\"player1\").value.trim() || \"agent 1\";\n        const p2 = document.getElementById(\"player2\").value.trim() || \"agent 2\";\n\n        players = mode === 2 ? [p1, p2] : [p1];\n        scores = Array(players.length).fill(0);\n        rounds = Array(players.length).fill(0);\n        currentPlayer = 0;\n\n        document.getElementById(\"resultDisplay\").innerHTML = \"\";\n        document.getElementById(\"nextBtn\").style.display = \"none\";\n        document.getElementById(\"readyBtn\").disabled = false;\n\n        newGrid();\n    }\n\n    function newGrid() {\n        if (players.length === 0) return;\n        currentGrid = getRandomWords(9);\n        correctIndex = -1;\n\n        const grid = document.getElementById(\"grid\");\n        grid.innerHTML = \"\";\n        currentGrid.forEach((word, i) => {\n            const div = document.createElement(\"div\");\n            div.className = \"card\";\n            div.textContent = direction === \"en-nl\" ? word.en : word.nl;\n            div.dataset.index = i;\n            grid.appendChild(div);\n        });\n\n        updateTurn();\n    }\n\n    function showQuestion() {\n        if (players.length === 0) return;\n        correctIndex = Math.floor(Math.random() * 9);\n        const targetWord = direction === \"en-nl\"\n            ? currentGrid[correctIndex].nl\n            : currentGrid[correctIndex].en;\n\n        document.getElementById(\"turnDisplay\").innerHTML =\n            `missie: waar zit \"<strong>${targetWord}<\/strong>\"?`;\n\n        document.querySelectorAll(\".card\").forEach(card => {\n            card.classList.remove(\"correct\", \"incorrect\");\n            card.classList.add(\"hiddenText\");\n            card.onclick = () => checkAnswer(parseInt(card.dataset.index), card);\n        });\n\n        document.getElementById(\"nextBtn\").style.display = \"none\";\n        document.getElementById(\"readyBtn\").disabled = true;\n    }\n\n    function checkAnswer(index, card) {\n        const all = document.querySelectorAll(\".card\");\n        all.forEach(c => {\n            c.classList.remove(\"hiddenText\");\n            c.onclick = null;\n        });\n\n        if (index === correctIndex) {\n            card.classList.add(\"correct\");\n            scores[currentPlayer]++;\n        } else {\n            card.classList.add(\"incorrect\");\n            all[correctIndex].classList.add(\"correct\");\n        }\n\n        rounds[currentPlayer]++;\n        updateScore();\n        document.getElementById(\"nextBtn\").style.display = \"inline-block\";\n    }\n\n    function nextRound() {\n        document.getElementById(\"nextBtn\").style.display = \"none\";\n\n        if ((mode === 2 && rounds[0] >= totalRounds && rounds[1] >= totalRounds) ||\n            (mode === 1 && rounds[0] >= totalRounds)) {\n            showWinner();\n        } else {\n            currentPlayer = (currentPlayer + 1) % players.length;\n            newGrid();\n            document.getElementById(\"readyBtn\").disabled = false;\n        }\n    }\n\n    function updateTurn() {\n        if (players.length > 0) {\n            document.getElementById(\"turnDisplay\").innerHTML = `turn: ${players[currentPlayer]}`;\n        }\n        updateScore();\n    }\n\n    function updateScore() {\n        if (players.length === 0) return;\n        const html = players.map((name, i) =>\n            `🎯 ${name}: ${scores[i]} (${rounds[i]}/${totalRounds})`\n        ).join(\" | \");\n        document.getElementById(\"scoreDisplay\").innerHTML = html;\n    }\n\n    function showWinner() {\n        const res = document.getElementById(\"resultDisplay\");\n        document.getElementById(\"turnDisplay\").innerHTML = \"mission accomplished!\";\n        if (mode === 1) {\n            res.innerHTML = `🎉 score: ${scores[0]} / ${totalRounds} <span class=\"confetti\">🎊<\/span>`;\n        } else if (scores[0] > scores[1]) {\n            res.innerHTML = `🏆 ${players[0]} wins! <span class=\"confetti\">🎊<\/span>`;\n        } else if (scores[1] > scores[0]) {\n            res.innerHTML = `🏆 ${players[1]} wins! <span class=\"confetti\">🎊<\/span>`;\n        } else {\n            res.innerHTML = `🤝 iT'S A TIE! <span class=\"confetti\">🎊<\/span>`;\n        }\n    }\n<\/script>\n\n<script>\n(function(){\n  function report(){\n    const height=Math.ceil(document.body.scrollHeight);\n    window.parent.postMessage({type:'engliforce-height',height:height},'*');\n  }\n  window.addEventListener('load',report);\n  if ('ResizeObserver' in window) new ResizeObserver(report).observe(document.body);\n  document.addEventListener('click',()=>setTimeout(report,90));\n  setTimeout(report,80);\n})();\n<\/script>\n<\/body>\n<\/html>", "pickle3": "<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n    <meta charset=\"UTF-8\">\n    <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n    <title>EngliForce Pickle: Leisure Detective<\/title>\n    <style>\n        :root {\n            --hero-purple-main: #43a047;\n            --hero-purple-dark: #388e3c;\n            --hero-yellow: #ffb703;\n            --hero-cyan: #81c784;\n            --dark-bg: #0b1a2a;\n            --hero-orange: #43a047;\n        }\n\n        body {\n            font-family: 'Trebuchet MS', Arial, sans-serif, sans-serif;\n            background: radial-gradient(circle at center, #102a43 0%, #05101a 100%);\n            color: white;\n            margin: 0;\n            padding: 0;\n            min-height: 100vh;\n            display: flex;\n            flex-direction: column;\n            align-items: center;\n        }\n\n        header {\n            width: 100%;\n            background: v 55,255,255,0.5);\n            width: 100%;\n        }\n\n        .flex-buttons { \n            display: grid; \n            grid-template-columns: 1fr 1fr; \n            gap: 10px; \n        }\n    <\/style>\n<style>html,body{min-height:0!important} html{overflow:hidden} .back-to-vocab{display:block;margin:20px auto 10px} @media(max-width:650px){ header h1{font-size:clamp(1.7rem,7vw,2.5rem);letter-spacing:1px} main,.container{padding:12px} .briefing-box{padding:18px} .mission-card{width:min(100%,250px)} .exercise-grid{grid-template-columns:1fr} .toggle-container{gap:8px} .language-select{flex-wrap:wrap;border-radius:16px} } <\/style>\n<\/head>\n<body>\n\n<header>\n    <h1>PICKLE 3: LEISURE DETECTIVE<\/h1>\n<\/header>\n\n<div class=\"container\">\n    <div class=\"section\" id=\"setup\">\n        <div class=\"instructions\">\n            🔎 <strong>Mission:<\/strong> Guess the leisure word using as few hints as possible.<br>\n            🌟 <strong>Bonus:<\/strong> Use <strong>English<\/strong> hints for +1 extra point!\n        <\/div>\n        \n        <label>Number of Agents:<\/label>\n        <select id=\"playerCount\" onchange=\"togglePlayer2()\">\n            <option value=\"1\">1 Agent<\/option>\n            <option value=\"2\" selected>2 Agents<\/option>\n        <\/select>\n        \n        <label>Agent 1:<\/label>\n        <input type=\"text\" id=\"player1\" placeholder=\"Name of Agent 1\" />\n        \n        <div id=\"player2Section\">\n            <label>Agent 2:<\/label>\n            <input type=\"text\" id=\"player2\" placeholder=\"Name of Agent 2\" />\n        <\/div>\n        \n        <button class=\"btn\" style=\"margin-top: 30px;\" onclick=\"startGame()\">Start Mission 🚀<\/button>\n    <\/div>\n\n    <div id=\"game\" style=\"display: none;\">\n        <div class=\"turn\" id=\"turnIndicator\">Turn: ...<\/div>\n        \n        <div class=\"scoreboard\">\n            <div><span id=\"name1\"><\/span>: <span id=\"score1\" style=\"color:var(--hero-yellow)\">0<\/span><\/div>\n            <div id=\"p2ScoreDisplay\"><span id=\"name2\"><\/span>: <span id=\"score2\" style=\"color:var(--hero-yellow)\">0<\/span><\/div>\n        <\/div>\n        \n        <div class=\"word-card\">\n            <div class=\"answer-reveal\" id=\"word-reveal\">Answer: ...<\/div>\n            \n            <label>Hint Language:<\/label>\n            <select id=\"hintLanguage\" onchange=\"resetClue()\">\n                <option value=\"nl\">Dutch<\/option>\n                <option value=\"en\">English (Bonus +1)<\/option>\n            <\/select>\n            \n            <div class=\"hint-text\" id=\"hintBox\">Click 'Next Hint' to start<\/div>\n            \n            <div class=\"flex-buttons\">\n                <button class=\"btn btn-purple\" onclick=\"nextHint()\">Next Hint 💡<\/button>\n                <button class=\"btn btn-purple\" onclick=\"showWord()\">Show Answer 👁️<\/button>\n                <button class=\"btn\" style=\"background:#4caf50; border-color:#2e7d32;\" onclick=\"correctGuess()\">Correct ✅<\/button>\n                <button class=\"btn\" style=\"background:var(--hero-orange); border-color:#388e3c;\" onclick=\"wrongGuess()\">Wrong ❌<\/button>\n            <\/div>\n        <\/div>\n    <\/div>\n    <button class=\"btn\" type=\"button\" onclick=\"returnToVocab()\">← Terug naar Vocab<\/button>\n<\/div>\n\n<footer>\n    &copy; 2026 EngliForce: Make English Your Superpower!\n<\/footer>\n\n<script>\n    const wordList = [{\"en\": \"leisure\", \"hints\": {\"nl\": [\"Je hebt het vooral na school of in het weekend.\", \"Je kiest zelf hoe je deze tijd besteedt.\", \"Het betekent vrije tijd.\"], \"en\": [\"You often have it after school.\", \"You can spend it relaxing or enjoying hobbies.\", \"It means free time.\"]}}, {\"en\": \"an activity\", \"hints\": {\"nl\": [\"Zwemmen of koken is hier een voorbeeld van.\", \"Je kunt dit alleen of samen doen.\", \"Het betekent een bezigheid of activiteit.\"], \"en\": [\"You can do this alone or with friends.\", \"Swimming and painting are examples.\", \"It is something you do.\"]}}, {\"en\": \"a board game\", \"hints\": {\"nl\": [\"Je speelt dit vaak aan tafel.\", \"Je gebruikt soms pionnen en een dobbelsteen.\", \"Mens-erger-je-niet is een voorbeeld.\"], \"en\": [\"You usually play this at a table.\", \"You might use dice and small pieces.\", \"Monopoly is an example.\"]}}, {\"en\": \"a collection\", \"hints\": {\"nl\": [\"Je kunt deze steeds groter maken.\", \"Soms bewaar je munten, kaarten of stickers.\", \"Het is een groep dingen die je verzamelt.\"], \"en\": [\"You can add new items to it.\", \"Coins and football cards are examples.\", \"It is a group of things you keep.\"]}}, {\"en\": \"a skill\", \"hints\": {\"nl\": [\"Je kunt dit oefenen en verbeteren.\", \"Gitaar spelen kan er een zijn.\", \"Het betekent vaardigheid.\"], \"en\": [\"You can learn and improve it.\", \"Cooking and playing guitar are examples.\", \"It is an ability you have learnt.\"]}}, {\"en\": \"to write stories\", \"hints\": {\"nl\": [\"Je gebruikt woorden en je fantasie.\", \"Je kunt het in een schrift of op een laptop doen.\", \"Je bedenkt en schrijft zelf een verhaal.\"], \"en\": [\"You use words and your imagination.\", \"You can do this in a notebook.\", \"You make up tales and put them into words.\"]}}, {\"en\": \"to bake\", \"hints\": {\"nl\": [\"Je doet dit vaak in de keuken.\", \"Je gebruikt soms meel, boter en suiker.\", \"Je maakt koekjes of cake in de oven.\"], \"en\": [\"You often do this in a kitchen.\", \"You might use flour and sugar.\", \"You make biscuits or cakes in an oven.\"]}}, {\"en\": \"to build\", \"hints\": {\"nl\": [\"Je hebt materialen of onderdelen nodig.\", \"Je kunt dit met LEGO of hout doen.\", \"Je maakt iets door delen samen te voegen.\"], \"en\": [\"You need materials or parts.\", \"You can do this with LEGO.\", \"You put pieces together to make something.\"]}}, {\"en\": \"to take photos\", \"hints\": {\"nl\": [\"Je kunt dit op vakantie do come this.\", \"It means you can do something well.\"]}}];\n\n    let words = [];\n    let p1 = '', p2 = '', playerCount = 2;\n    let score = [0, 0];\n    let currentIndex = 0;\n    let currentHint = 0;\n    let currentPlayer = 0;\n\n    function returnToVocab() { window.parent.postMessage({type:'engliforce-nav',view:'vocab'}, '*'); }\n    function togglePlayer2() {\n        const val = document.getElementById(\"playerCount\").value;\n        document.getElementById(\"player2Section\").style.display = (val === \"1\") ? \"none\" : \"block\";\n    }\n\n    function startGame() {\n        playerCount = parseInt(document.getElementById(\"playerCount\").value);\n        p1 = document.getElementById(\"player1\").value || \"Agent 1\";\n        p2 = document.getElementById(\"player2\").value || \"Agent 2\";\n\n        // Kopieer de lijst en schud hem volledig willekeurig door elkaar\n        words = [...wordList].sort(() => Math.random() - 0.5);\n\n        score = [0, 0];\n        currentIndex = 0;\n        currentPlayer = 0;\n\n        document.getElementById(\"name1\").textContent = p1;\n        document.getElementById(\"name2\").textContent = (playerCount === 2) ? p2 : \"\";\n        document.getElementById(\"p2ScoreDisplay\").style.visibility = (playerCount === 2) ? \"visible\" : \"hidden\";\n\n        document.getElementById(\"setup\").style.display = \"none\";\n        document.getElementById(\"game\").style.display = \"block\";\n        updateScore();\n        showTurn();\n        resetWordCard();\n    }\n\n    function showTurn() {\n        const name = currentPlayer === 0 ? p1 : p2;\n        document.getElementById(\"turnIndicator\").textContent = (playerCount === 1) ? `Agent: ${p1}` : `Turn: ${name}`;\n    }\n\n    function resetWordCard() {\n        currentHint = 0;\n        document.getElementById(\"hintBox\").textContent = \"Click 'Next Hint' to start\";\n        document.getElementById(\"word-reveal\").style.display = \"none\";\n    }\n\n    function nextHint() {\n        if (currentIndex >= words.length) return;\n        if (currentHint >= 3) return;\n        const lang = document.getElementById(\"hintLanguage\").value;\n        const hint = words[currentIndex].hints[lang][currentHint];\n        document.getElementById(\"hintBox\").textContent = `Hint ${currentHint + 1}: ${hint}`;\n        currentHint++;\n    }\n\n    function showWord() {\n        if (currentIndex >= words.length) return;\n        document.getElementById(\"word-reveal\").textContent = `Answer: ${words[currentIndex].en}`;\n        document.getElementById(\"word-reveal\").style.display = \"block\";\n    }\n\n    function correctGuess() {\n        if (currentIndex >= words.length) return;\n        const lang = document.getElementById(\"hintLanguage\").value;\n        let points = Math.max(1, 4 - currentHint);\n        if (lang === \"en\") points += 1;\n        score[currentPlayer] += points;\n        nextWord();\n    }\n\n    function wrongGuess() {\n        if (currentIndex >= words.length) return;\n        nextWord();\n    }\n\n    function nextWord() {\n        currentIndex++;\n        if (playerCount === 2) currentPlayer = 1 - currentPlayer;\n        updateScore();\n        if (currentIndex >= words.length) {\n            document.getElementById(\"turnIndicator\").textContent = \"Mission Accomplished!\";\n            document.getElementById(\"hintBox\").textContent = \"All words discovered!\";\n            document.getElementById(\"word-reveal\").style.display = \"none\";\n        } else {\n            showTurn();\n            resetWordCard();\n        }\n    }\n\n    function updateScore() {\n        document.getElementById(\"score1\").textContent = score[0] + \" pt\";\n        document.getElementById(\"score2\").textContent = score[1] + \" pt\";\n    }\n\n    function resetClue() {\n        if (currentIndex >= words.length) return;\n        if (currentHint > 0) {\n            const lang = document.getElementById(\"hintLanguage\").value;\n            const hint = words[currentIndex].hints[lang][currentHint - 1];\n            document.getElementById(\"hintBox\").textContent = `Hint ${currentHint}: ${hint}`;\n        }\n    }\n<\/script>\n\n<script>\n(function(){\n  function report(){\n    const height=Math.ceil(document.body.scrollHeight);\n    window.parent.postMessage({type:'engliforce-height',height:height},'*');\n  }\n  window.addEventListener('load',report);\n  if ('ResizeObserver' in window) new ResizeObserver(report).observe(document.body);\n  document.addEventListener('click',()=>setTimeout(report,90));\n  setTimeout(report,80);\n})();\n<\/script>\n<\/body>\n<\/html>"};
const ready = {vocab:false,pickle1:false,pickle2:false,pickle3:false};
const frames = {};
for (const key of Object.keys(documents)) frames[key]=document.getElementById('frame-'+key);
let current='vocab';
function loadIfNeeded(key){
  if(!ready[key]){ready[key]=true;frames[key].srcdoc=documents[key];}
}
function showPage(key){
  if(!(key in frames))return;
  loadIfNeeded(key);
  current=key;
  for(const [name,frame] of Object.entries(frames)){
    frame.classList.toggle('active',name===key);
    frame.setAttribute('aria-hidden',name!==key?'true':'false');
  }
  window.scrollTo({top:0,behavior:'instant'});
}
window.addEventListener('message',event=>{
  const source=Object.keys(frames).find(name=>frames[name].contentWindow===event.source);
  if(!source||!event.data||typeof event.data!=='object')return;
  if(event.data.type==='engliforce-nav' && ['vocab','pickle1','pickle2','pickle3'].includes(event.data.view))showPage(event.data.view);
  if(event.data.type==='engliforce-height' && Number.isFinite(event.data.height)) {
    frames[source].style.height=Math.max(200,Math.min(20000,event.data.height+3))+'px';
  }
});
showPage('vocab');
